modLoader = "javafml"
loaderVersion = "[1,)"
license = "MIT"
issueTrackerURL = "https://github.com/traelmyx/ageing-spawners-fabric/issues"

[[mods]]
modId = "${id}"
version = "${version}"
displayName = "${name}"
authors = "traelmyx (port), Mrbysco (original)"
${logo_key} = "assets/ageingspawners/icon.png"
displayTest = "IGNORE_ALL_VERSION"
description = '''When the server watchdog kills a frozen server, its crash report now shows every thread's whole stack instead of the first 8 lines. Port of FullStack Watchdog by TelepathicGrunt.'''

[[mixins]]
config = "ageingspawners.mixins.json"

[[dependencies.${id}]]
modId = "neoforge"
type = "required"
versionRange = "[${neoforge_major},)"
ordering = "NONE"
side = "BOTH"

[[dependencies.${id}]]
modId = "minecraft"
type = "required"
versionRange = "${mc_dep}"
ordering = "NONE"
side = "BOTH"
