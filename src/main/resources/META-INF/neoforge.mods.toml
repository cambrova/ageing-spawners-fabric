modLoader = "javafml"
loaderVersion = "[1,)"
license = "MIT"
issueTrackerURL = "https://github.com/traelmyx/ageing-spawners-fabric/issues"

[[mods]]
modId = "${id}"
version = "${version}"
displayName = "${name}"
authors = "traelmyx (port), Mrbysco (original)"
${logo_key} = "assets/ageingspawners/icon.png"
displayTest = "IGNORE_ALL_VERSION"
description = '''Spawners break after spawning a set number of mobs, so a spawner farm doesn't run forever. Fabric port of Ageing Spawners by Mrbysco.'''

[[mixins]]
config = "ageingspawners.mixins.json"

[[dependencies.${id}]]
modId = "neoforge"
type = "required"
versionRange = "[${neoforge_major},)"
ordering = "NONE"
side = "BOTH"

[[dependencies.${id}]]
modId = "minecraft"
type = "required"
versionRange = "${mc_dep}"
ordering = "NONE"
side = "BOTH"
